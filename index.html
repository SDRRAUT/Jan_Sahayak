<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JanSahayak — Public Grievance Intelligence & Resolution Platform</title>
    <meta name="description" content="JanSahayak is a public grievance intelligence platform that turns everyday citizen voices into structured insights, connected evidence and actionable resolution recommendations." />
    
    <!-- Google Fonts: Fraunces (Display Serif), Plus Jakarta Sans (UI Sans), JetBrains Mono (Tabular Numbers) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- PWA & Mobile Meta -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0B1914" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JanSahayak" />

    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- OpenGraph & Social Cards -->
    <meta property="og:title" content="JanSahayak — Public Grievance Intelligence Platform" />
    <meta property="og:description" content="Translating unstructured citizen voice and text into structured insights, connected evidence, and actionable resolution recommendations." />
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
