name: JanSahayk CI

on:
  push:
    branches: [ main, modern-design-ui, ui-ux ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Backend Syntax
        run: |
          node --check server/index.js
          node --check start.js
          find server -name "*.js" -exec node --check {} +
          find scripts -name "*.js" -exec node --check {} +

      - name: Build Frontend Application
        run: npm run build
